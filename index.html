<script>
    // Модальное окно и музыка
    (function() {

        var audio = document.getElementById("backgroundMusic");

</script>

<script>
    // -------- НАСТРОЙКА ОТПРАВКИ ФОРМЫ --------
    // ⚠️ ВСТАВЬТЕ СВОЙ URL ВЕБ-ПРИЛОЖЕНИЯ:
    const URL_APP = "https://script.google.com/macros/s/AKfycbyript3olu6aqDmKoTl0008IbBwQPF1ObrJqRlJXKEb5BBYVU7htFjeOO9nEHs5zkR2Og/exec";   // Замените на ваш адрес вида https://script.google.com/macros/s/.../exec

    const form = document.querySelector("#form");

    // Функция проверки заполнения обязательных полей
    function isFilled(details) {
        const { name, choice } = details;
        if (!name || !choice) return false;
        return true;
    }

    form.addEventListener("submit", async (ev) => {
        ev.preventDefault();

        const choiceElem = document.querySelector("[name=choice]:checked");
        const nameElem = document.querySelector("[name=name]");
        const messageElem = document.querySelector("[name=message]");
        const submitButton = form.querySelector("[type=submit]");

        let details = {
            name: nameElem ? nameElem.value.trim() : '',
            choice: choiceElem ? choiceElem.value : '',
            message: messageElem ? messageElem.value.trim() : ''
        };

        if (!isFilled(details)) {
            alert('Барлық міндетті өрістерді толтырыңыз! (есім және жауап)');
            return;
        }

        // Блокируем кнопку, чтобы избежать повторной отправки
        submitButton.disabled = true;

        try {
            const response = await fetch(URL_APP, {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify(details)
            });

            const result = await response.json();
            if (result.result === 'ok') {
                alert('Жауабыңызға рахмет!');
                // Очищаем поля
                nameElem.value = '';
                if (choiceElem) choiceElem.checked = false;
                messageElem.value = '';
            } else {
                alert('Қате кетті. Қайталап көріңіз.');
                console.error('Server error:', result);
            }
        } catch (err) {
            console.error('Error:', err);
            alert('Қате кетті: ' + err.message);
        } finally {
            submitButton.disabled = false;
        }
    });
</script>

<!-- Анимация появления при скролле (fade-in) -->
<script>
    document.addEventListener("DOMContentLoaded", function() {
        var observer = new IntersectionObserver(function(entries) {
            entries.forEach(function(entry) {
                if (entry.isIntersecting) {
                    entry.target.classList.add("visible");
                    observer.unobserve(entry.target);
                }
            });
        });
        var elements = document.querySelectorAll(".fade-in");
        elements.forEach(function(element) {
            observer.observe(element);
        });
    });
</script>

<!-- Анимация element-animation -->
<script>
    function onEntry(entry) { 
        entry.forEach(change => { 
            if (change.isIntersecting) { 
                change.target.classList.add('element-show'); 
            } 
        }); 
    } 
    let options = { threshold: [0.5] }; 
    let observer = new IntersectionObserver(onEntry, options); 
    let elements = document.querySelectorAll('.element-animation'); 
    for (let elm of elements) { 
        observer.observe(elm); 
    }
</script>

<!-- Таймер обратного отсчёта -->
<script>
    document.addEventListener('DOMContentLoaded', function() {
        function updateCountdown() {
            const endDate = new Date("September 19, 2026 18:00:00").getTime();
            const now = new Date().getTime();
            const distance = endDate - now;

            const days = Math.floor(distance / (1000 * 60 * 60 * 24));
            const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((distance % (1000 * 60)) / 1000);

            document.getElementById("days").innerText = days < 0 ? "00" : days;
            document.getElementById("hours").innerText = hours < 0 ? "00" : hours;
            document.getElementById("minutes").innerText = minutes < 0 ? "00" : minutes;
            document.getElementById("seconds").innerText = seconds < 0 ? "00" : seconds;

            if (distance < 0) {
                clearInterval(timerInterval);
            }
        }

        const timerInterval = setInterval(updateCountdown, 1000);
        updateCountdown();
    });
</script>
